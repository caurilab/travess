packages:
  - "travess-web"
  - "travess-mobile"
  - "travess-desktop"
  - "packages/*"

# Autorise esbuild (tsup/vitest/vite) et electron à exécuter leur script
# d'installation (electron télécharge son binaire au postinstall).
allowBuilds:
  electron: true
  esbuild: true
onlyBuiltDependencies:
  - esbuild
  - electron
