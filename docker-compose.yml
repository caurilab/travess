services:
  api:
    build: ./travess-api
    volumes:
      - ./travess-api:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  postgres:
    image: postgres:16
    # L'admin est le superutilisateur « postgres ». Le rôle applicatif
    # « travess » est créé NOSUPERUSER par le script d'init (ops/postgres/init),
    # condition pour que la Row-Level Security s'applique réellement (ADR-004).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-adminsecret}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: ./travess-api
    command: php artisan queue:work --tries=3
    volumes:
      - ./travess-api:/var/www/html
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  scheduler:
    build: ./travess-api
    command: php artisan schedule:work
    volumes:
      - ./travess-api:/var/www/html
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

volumes:
  pgdata:
