name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule les exécutions redondantes sur une même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Packages JS/TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (dont parité ISO 6346)
        run: pnpm test

      - name: Build
        run: pnpm build

  api:
    name: API Laravel
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travess
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: travess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travess"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: travess-api

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: travess
      DB_USERNAME: travess
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, mbstring, bcmath
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Créer la base de test
        run: PGPASSWORD=secret psql -h 127.0.0.1 -U travess -c 'CREATE DATABASE travess_test;'

      - name: Vérifier les migrations (ordre + RLS)
        run: php artisan migrate --force

      - name: Analyse statique (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Style de code (Pint)
        run: vendor/bin/pint --test

      - name: Tests (étanchéité tenant, RLS, auth, parité ISO 6346)
        run: php artisan test
